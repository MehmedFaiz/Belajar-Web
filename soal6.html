<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Riwayat Pendidikan</title>

    <style>
    table {
        border-collapse: collapse;
        width: 70%;
    }

    th, td {
        border: 1px solid #2e7d32;
        padding: 8px;
        text-align: center;
    }

    th {
        background-color: #4caf50;
        color: white;
    }

    td {
        background-color: #e3f2fd;
    }
</style>
</head>

<body>

    <h1>Riwayat Pendidikan</h1>

    <table>
        <tr>
            <th rowspan="2">No.</th>
            <th rowspan="2">Nama Sekolah</th>
            <th colspan="2">Tahun</th>
        </tr>

        <tr>
            <th>Masuk</th>
            <th>Lulus</th>
        </tr>

        <tr>
            <td>1.</td>
            <td>TKIT Iqro</td>
            <td>2011</td>
            <td>2013</td>
        </tr>

        <tr>
            <td>2.</td>
            <td>SDIT Iqra</td>
            <td>2013</td>
            <td>2019</td>
        </tr>

        <tr>
            <td>3.</td>
            <td>SMPIT Al-Hassan</td>
            <td>2019</td>
            <td>2022</td>
        </tr>

        <tr>
            <td>4.</td>
            <td>SMAIT Al-Hassan</td>
            <td>2022</td>
            <td>2025</td>
        </tr>

        <tr>
            <td>5.</td>
            <td>Universitas Brawijaya</td>
            <td>2025</td>
            <td>Sekarang</td>
        </tr>
    </table>

</body>
</html>
